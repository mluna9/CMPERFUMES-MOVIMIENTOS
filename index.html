<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C&M Perfumes - Haute Parfumerie & Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(217, 119, 6, 0.6); }
    </style>
</head>
<body class="min-h-screen bg-[#0b0d14] text-slate-100 flex flex-col transition-colors duration-200 selection:bg-amber-500 selection:text-slate-950">

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <header id="main-header" class="bg-[#0e111a]/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-xl border bg-slate-900 border-slate-800 text-slate-300">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center space-x-3.5 group cursor-pointer" onclick="switchTab('inicio')">
                    <div class="relative w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-700 via-amber-500 to-amber-200 p-[1px] shadow-xl shadow-amber-950/30">
                        <div class="w-full h-full rounded-[15px] flex items-center justify-center bg-[#0b0d14]">
                            <span class="font-serif italic font-bold bg-gradient-to-br from-amber-200 via-amber-400 to-amber-600 bg-clip-text text-transparent text-sm tracking-tighter">
                                C&amp;M
                            </span>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <span class="font-serif text-base tracking-[0.25em] font-medium bg-gradient-to-r from-amber-100 via-amber-300 to-amber-500 bg-clip-text text-transparent uppercase leading-tight">
                            C&amp;M Perfumes
                        </span>
                        <span class="text-[8px] font-mono tracking-[0.3em] uppercase mt-0.5 text-amber-500/60">
                            Mati &amp; Cele &bull; Partner Management
                        </span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="toggleTheme()" class="p-2 rounded-xl border bg-slate-900 border-slate-800 text-amber-400 hover:bg-slate-800 transition-colors" title="Cambiar tema">
                    <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
                </button>
                <button onclick="openConfigModal()" class="px-3 py-1.5 rounded-xl border text-xs font-mono flex items-center space-x-1.5 transition-colors bg-amber-500/10 border-amber-500/30 text-amber-400">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                    <span id="supabase-status-text" class="hidden sm:inline">Conectar Supabase</span>
                </button>
                <div id="auth-header-section"></div>
            </div>
        </div>
    </header>

    <div id="login-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="max-w-md w-full p-6 rounded-2xl border shadow-2xl space-y-4 bg-slate-900 border-slate-800">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mx-auto text-amber-400">
                    <i data-lucide="lock" class="w-5 h-5"></i>
                </div>
                <h2 class="font-serif text-xl font-normal text-amber-200">Acceso a C&amp;M Perfumes</h2>
                <p class="text-xs text-slate-400">Ingresa con tu usuario registrado para sincronizar datos en vivo.</p>
            </div>
            <div id="auth-error-box" class="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl text-xs text-rose-400 flex items-center space-x-2 hidden">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <span id="auth-error-msg"></span>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 focus:outline-none focus:border-amber-500" placeholder="mati@cmperfumes.com">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 focus:outline-none focus:border-amber-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-semibold hover:from-amber-400 hover:to-amber-500 transition-all shadow-lg">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <div class="flex-1 flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-[#090b10] border-r border-slate-800/80 text-slate-300 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col">
            <div class="p-4 border-b border-slate-800/80 flex justify-between items-center md:hidden">
                <span class="font-serif text-sm tracking-widest text-amber-200 uppercase">Menú C&amp;M</span>
                <button onclick="toggleMobileMenu()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <nav id="nav-menu" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto"></nav>
            <div class="p-4 border-t border-slate-800/80 text-[11px] text-slate-500 text-center font-mono">
                C&amp;M Perfumes &bull; v2.7 HTML Pro
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
            <div id="view-container"></div>
        </main>
    </div>

    <div id="config-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="max-w-md w-full p-6 rounded-2xl border shadow-2xl space-y-4 bg-slate-900 border-slate-800">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <h3 class="font-serif text-lg text-amber-200">Configuración Supabase</h3>
                <button onclick="closeConfigModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="saveSupabaseConfig(event)" class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1">Supabase URL</label>
                    <input type="text" id="sup-url-input" class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 font-mono" placeholder="https://xyz.supabase.co">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">Supabase Anon Key</label>
                    <input type="password" id="sup-key-input" class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 font-mono" placeholder="eyJhbGciOi...">
                </div>
                <div class="pt-2 flex justify-end space-x-2">
                    <button type="submit" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold rounded-xl">Guardar Conexión</button>
                </div>
            </form>
        </div>
    </div>

    <div id="dynamic-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div id="dynamic-modal-content" class="max-w-xl w-full p-6 rounded-2xl border shadow-2xl space-y-4 bg-slate-900 border-slate-800 max-h-[90vh] overflow-y-auto"></div>
    </div>

    <script>
        let theme = localStorage.getItem('CM_THEME') || 'dark';
        let activeTab = 'inicio';
        let mobileMenuOpen = false;

        let supabaseUrl = localStorage.getItem('CM_SUPABASE_URL') || '';
        let supabaseKey = localStorage.getItem('CM_SUPABASE_KEY') || '';
        let supabaseClient = null;
        let currentUser = null;

        let state = {
            products: [
                { id: 'p1', name: 'Sauvage', brand: 'Dior', concentration: 'EDP', volume_ml: 100, internal_code: 'CM-101', cost_price: 45000, sale_price: 98000, physical_stock: 8, reserved_stock: 2, min_stock: 2, notes: 'Batch 2025' },
                { id: 'p2', name: 'Bleu de Chanel', brand: 'Chanel', concentration: 'EDP', volume_ml: 100, internal_code: 'CM-102', cost_price: 52000, sale_price: 115000, physical_stock: 5, reserved_stock: 1, min_stock: 2, notes: 'Excelente salida' },
                { id: 'p3', name: 'Baccarat Rouge 540', brand: 'Maison Francis Kurkdjian', concentration: 'Extrait', volume_ml: 70, internal_code: 'CM-103', cost_price: 75000, sale_price: 165000, physical_stock: 3, reserved_stock: 0, min_stock: 1, notes: 'Alta demanda' }
            ],
            inventoryMovements: [
                { id: 'm1', product_id: 'p1', type: 'COMPRA', quantity: 10, reason: 'Ingreso inicial por reposición', user_email: 'mati@cmperfumes.com' }
            ],
            orders: [
                { id: 'o1', client_name: 'Lucía Gómez', client_phone: '+5491123456789', product_id: 'p1', product_name: 'Dior Sauvage EDP', quantity: 1, agreed_price: 98000, status: 'Reservado', payment_status: 'Seña Pagada', paid_amount: 30000, pending_amount: 68000, notes: 'Retira el viernes' }
            ],
            sales: [
                { id: 's1', operation_number: 1001, client_name: 'Carlos Ruiz', total_amount: 115000, total_cost: 52000, estimated_margin: 63000, net_profit: 63000, mati_profit: 31500, cele_profit: 31500, payment_status: 'Cobrado', delivery_status: 'Entregado', payment_method: 'Transferencia', paid_amount: 115000, pending_amount: 0, items: [{ product_id: 'p2', product_name: 'Bleu de Chanel EDP', quantity: 1, unit_price: 115000, unit_cost: 52000 }] }
            ],
            cashMovements: [
                { id: 'c1', type: 'INGRESO', category: 'Venta', description: 'Venta #1001 Carlos Ruiz', amount: 115000, payment_method: 'Transferencia', date: '2026-10-15' }
            ],
            supplies: [
                { id: 'sup1', name: 'Frascos 100ml Cristal', unit: 'Unidades', quantity: 45, min_stock: 15, unit_cost: 1800 },
                { id: 'sup2', name: 'Atomizadores Negro/Plata', unit: 'Unidades', quantity: 60, min_stock: 20, unit_cost: 600 }
            ],
            debts: [
                { id: 'd1', concept: 'Capital Inicial Préstamo Reposición', initial_amount: 220000, current_amount: 120000, status: 'En Pago' }
            ]
        };

        const navItems = [
            { id: 'inicio', label: 'Resumen General', icon: 'layout-dashboard' },
            { id: 'stock', label: 'Stock & Inventario', icon: 'package' },
            { id: 'pedidos', label: 'Pedidos y Reservas', icon: 'shopping-bag' },
            { id: 'ventas', label: 'Ventas (Mati & Cele)', icon: 'shopping-cart' },
            { id: 'caja', label: 'Caja y Movimientos', icon: 'wallet' },
            { id: 'inversion', label: 'Ganancias & Inversión', icon: 'users' },
            { id: 'insumos', label: 'Insumos y Packaging', icon: 'box' },
            { id: 'calculadora', label: 'Calculadora de Margen', icon: 'calculator' },
            { id: 'informes', label: 'Reportes y Datos', icon: 'file-text' },
            { id: 'config', label: 'Ajustes', icon: 'settings' }
        ];

        window.onload = function() {
            applyTheme();
            initSupabaseClient();
            renderNavigation();
            renderHeaderAuth();
            switchTab('inicio');
            lucide.createIcons();
        };

        function initSupabaseClient() {
            if (supabaseUrl && supabaseKey && window.supabase) {
                try {
                    supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
                    document.getElementById('supabase-status-text').innerText = 'Supabase Conectado';
                    checkSupabaseSession();
                } catch(e) {
                    console.error('Supabase init error', e);
                }
            } else {
                document.getElementById('supabase-status-text').innerText = 'Conectar Supabase';
            }
        }

        async function checkSupabaseSession() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
                currentUser = session.user;
                renderHeaderAuth();
                fetchAllDataSupabase();
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        }

        async function fetchAllDataSupabase() {
            if (!supabaseClient) return;
            try {
                const { data: prod } = await supabaseClient.from('products').select('*');
                if (prod && prod.length > 0) state.products = prod;
                const { data: ord } = await supabaseClient.from('orders').select('*');
                if (ord && ord.length > 0) state.orders = ord;
                const { data: sal } = await supabaseClient.from('sales').select('*');
                if (sal && sal.length > 0) state.sales = sal;
                renderCurrentView();
            } catch(e) {
                console.error('Error fetching Supabase data:', e);
            }
        }

        function notify(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-2xl border text-white flex items-center space-x-3 backdrop-blur-md transition-all transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/90 border-rose-500/50 text-rose-200'
            }`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-triangle'}" class="w-4 h-4 ${type === 'success' ? 'text-emerald-400' : 'text-rose-400'}"></i><span class="font-medium text-sm tracking-wide">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function toggleTheme() {
            theme = theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('CM_THEME', theme);
            applyTheme();
        }

        function applyTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (theme === 'dark') {
                html.classList.add('dark');
                if(icon) icon.setAttribute('data-lucide', 'sun');
            } else {
                html.classList.remove('dark');
                if(icon) icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            const sidebar = document.getElementById('sidebar');
            if (mobileMenuOpen) {
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function renderNavigation() {
            const nav = document.getElementById('nav-menu');
            nav.innerHTML = navItems.map(item => {
                const isActive = activeTab === item.id;
                return `
                    <button onclick="switchTab('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${
                        isActive 
                            ? 'bg-gradient-to-r from-amber-500/20 via-amber-500/10 to-transparent border border-amber-500/30 text-amber-300 font-semibold' 
                            : 'hover:bg-slate-900 text-slate-400 hover:text-slate-200'
                    }">
                        <i data-lucide="${item.icon}" class="w-4 h-4 ${isActive ? 'text-amber-400' : 'text-slate-400'}"></i>
                        <span>${item.label}</span>
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderHeaderAuth() {
            const authDiv = document.getElementById('auth-header-section');
            if (currentUser) {
                authDiv.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-300 font-serif text-xs font-bold">
                            ${currentUser.email.substring(0, 2).toUpperCase()}
                        </div>
                        <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-rose-400" title="Cerrar sesión"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                    </div>
                `;
            } else {
                authDiv.innerHTML = `<div class="text-xs font-mono text-amber-400/80 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20">Modo Local</div>`;
            }
            lucide.createIcons();
        }

        function switchTab(tabId) {
            activeTab = tabId;
            mobileMenuOpen = false;
            renderNavigation();
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('view-container');
            switch(activeTab) {
                case 'inicio': container.innerHTML = renderDashboardView(); break;
                case 'stock': container.innerHTML = renderStockView(); break;
                case 'pedidos': container.innerHTML = renderOrdersView(); break;
                case 'ventas': container.innerHTML = renderSalesView(); break;
                case 'caja': container.innerHTML = renderCashView(); break;
                case 'inversion': container.innerHTML = renderInvestmentView(); break;
                case 'insumos': container.innerHTML = renderSuppliesView(); break;
                case 'calculadora': container.innerHTML = renderCalculatorView(); break;
                case 'informes': container.innerHTML = renderReportsView(); break;
                case 'config': container.innerHTML = renderConfigView(); break;
                default: container.innerHTML = renderDashboardView();
            }
            lucide.createIcons();
        }

        function renderDashboardView() {
            const totalSales = state.sales.reduce((acc, s) => acc + s.total_amount, 0);
            const totalProfit = state.sales.reduce((acc, s) => acc + s.net_profit, 0);
            const totalStockCount = state.products.reduce((acc, p) => acc + p.physical_stock, 0);
            const activeOrdersCount = state.orders.filter(o => o.status !== 'Entregado' && o.status !== 'Cancelado').length;
            const matiProfit = totalProfit / 2;
            const celeProfit = totalProfit / 2;

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-2 border-b border-slate-800/80">
                        <div>
                            <h1 class="font-serif text-2xl font-normal text-amber-200">Resumen General C&amp;M</h1>
                            <p class="text-xs text-slate-400 mt-0.5">Indicadores clave de rendimiento para Mati y Cele.</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-slate-900/40 border border-slate-800/80 p-5 rounded-2xl flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs text-slate-400 font-mono uppercase">Ventas Totales</p>
                                    <h3 class="text-2xl font-semibold font-mono text-amber-300 mt-1">$${totalSales.toLocaleString()}</h3>
                                </div>
                                <div class="p-2.5 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-400"><i data-lucide="dollar-sign" class="w-5 h-5"></i></div>
                            </div>
                            <p class="text-[11px] text-slate-500 mt-3">${state.sales.length} operaciones registradas</p>
                        </div>
                        <div class="bg-slate-900/40 border border-slate-800/80 p-5 rounded-2xl flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs text-slate-400 font-mono uppercase">Ganancia Neta Total</p>
                                    <h3 class="text-2xl font-semibold font-mono text-emerald-400 mt-1">$${totalProfit.toLocaleString()}</h3>
                                </div>
                                <div class="p-2.5 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
                            </div>
                            <p class="text-[11px] text-slate-500 mt-3">Mati ($${matiProfit.toLocaleString()}) &bull; Cele ($${celeProfit.toLocaleString()})</p>
                        </div>
                        <div class="bg-slate-900/40 border border-slate-800/80 p-5 rounded-2xl flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs text-slate-400 font-mono uppercase">Perfumes en Stock</p>
                                    <h3 class="text-2xl font-semibold font-mono text-slate-200 mt-1">${totalStockCount} un.</h3>
                                </div>
                                <div class="p-2.5 bg-blue-500/10 border border-blue-500/20 rounded-xl text-blue-400"><i data-lucide="package" class="w-5 h-5"></i></div>
                            </div>
                            <p class="text-[11px] text-slate-500 mt-3">${state.products.length} referencias distintas</p>
                        </div>
                        <div class="bg-slate-900/40 border border-slate-800/80 p-5 rounded-2xl flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-xs text-slate-400 font-mono uppercase">Pedidos Activos</p>
                                    <h3 class="text-2xl font-semibold font-mono text-amber-200 mt-1">${activeOrdersCount}</h3>
                                </div>
                                <div class="p-2.5 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-400"><i data-lucide="shopping-bag" class="w-5 h-5"></i></div>
                            </div>
                            <p class="text-[11px] text-slate-500 mt-3">Consultas y reservas en curso</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStockView() {
            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-2 border-b border-slate-800/80">
                        <div>
                            <h1 class="font-serif text-2xl font-normal text-amber-200">Gestión de Stock &amp; Inventario</h1>
                            <p class="text-xs text-slate-400 mt-0.5">Control de unidades físicas, reservas y movimientos.</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="openProductModal()" class="flex items-center space-x-2 px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 rounded-xl font-medium text-xs shadow-lg hover:from-amber-400 hover:to-amber-500 transition-all">

        function calculateMargin() {
            const essence = parseFloat(document.getElementById('calc-essence').value) || 0;
            const bottle = parseFloat(document.getElementById('calc-bottle').value) || 0;
            const packaging = parseFloat(document.getElementById('calc-packaging').value) || 0;
            const margin = parseFloat(document.getElementById('calc-margin').value) || 0;

            const totalCost = essence + bottle + packaging;
            const suggestedPrice = totalCost * (1 + margin / 100);

            document.getElementById('res-total-cost').innerText = `$${totalCost.toLocaleString()}`;
            document.getElementById('res-suggested-price').innerText = `$${suggestedPrice.toLocaleString()}`;
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `CM_Perfumes_Backup_${new Date().toISOString().slice(0,10)}.json`);

            const pass = document.getElementById('login-password').value;
            if (supabaseClient) {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
                if (error) {
                    document.getElementById('auth-error-box').classList.remove('hidden');
                    document.getElementById('auth-error-msg').innerText = error.message;
                } else {
                    currentUser = data.user;
                    document.getElementById('login-modal').classList.add('hidden');
                    renderHeaderAuth();
                    fetchAllDataSupabase();
                    notify('Sesión iniciada correctamente.');
                }
            } else {

                renderHeaderAuth();
                notify('Modo local autenticado como ' + email);

        }

        function convertToSale(id) {
            const ord = state.orders.find(o => o.id === id);
            if (!ord) return;
            const prod = state.products.find(p => p.id === ord.product_id);
            const cost = prod ? prod.cost_price * ord.quantity : 0;
            const profit = ord.agreed_price - cost;

            const newSale = {
                id: 's_' + Date.now(),
                operation_number: 1000 + state.sales.length + 1,
                client_name: ord.client_name,
                total_amount: ord.agreed_price,
                total_cost: cost,
                estimated_margin: profit,
                net_profit: profit,
                mati_profit: profit / 2,
                cele_profit: profit / 2,
                payment_status: 'Cobrado',
                delivery_status: 'Entregado',
                payment_method: 'Transferencia',
                paid_amount: ord.agreed_price,
                pending_amount: 0,
                items: [{ product_id: ord.product_id, product_name: ord.product_name, quantity: ord.quantity, unit_price: ord.agreed_price / ord.quantity, unit_cost: cost / ord.quantity }]
            };

            state.sales.push(newSale);
            state.cashMovements.push({
                id: 'c_' + Date.now(),
                type: 'INGRESO',
                category: 'Venta',
                description: `Venta #${newSale.operation_number} ${ord.client_name}`,
                amount: ord.agreed_price,
                payment_method: 'Transferencia',
                date: new Date().toISOString().slice(0, 10)
            });

            if (prod) {
                prod.physical_stock = Math.max(0, prod.physical_stock - ord.quantity);
                prod.reserved_stock = Math.max(0, prod.reserved_stock - ord.quantity);
            }

            state.orders = state.orders.filter(o => o.id !== id);
            renderCurrentView();
            notify('¡Pedido convertido en Venta con éxito!');
        }

                    <div>
                        <label class="text-slate-400 block mb-1">Motivo / Razón</label>
                        <input type="text" id="sm-reason" required class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200" placeholder="Nueva tanda de producción">
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold rounded-xl">Actualizar Stock</button>
                </form>
            `;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function saveStockMove(e, prodId) {
            e.preventDefault();
            const prod = state.products.find(p => p.id === prodId);
            const type = document.getElementById('sm-type').value;
            const qty = parseInt(document.getElementById('sm-qty').value);
            const reason = document.getElementById('sm-reason').value;

            if (prod) {
                if (type === 'INGRESO') prod.physical_stock += qty;
                else prod.physical_stock = Math.max(0, prod.physical_stock - qty);
            }

            state.inventoryMovements.push({
                id: 'm_' + Date.now(),
                product_id: prodId,
                type,
                quantity: qty,
                reason,
                user_email: currentUser?.email || 'admin@cmperfumes.com'
            });

            closeDynamicModal();
            renderCurrentView();
            notify('Stock actualizado correctamente.');
        }

        function closeDynamicModal() {
            document.getElementById('dynamic-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
