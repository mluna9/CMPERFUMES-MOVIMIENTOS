<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C&M Parfum · Mati & Cele &mdash; Haute Parfumerie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.firebaseAppInit = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut, getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.3); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen bg-[#0b0d14] text-slate-100 flex flex-col transition-colors duration-200 selection:bg-amber-500 selection:text-slate-950">

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Barra de Estado Cloud -->
    <div id="cloud-status-banner" class="bg-amber-950/40 border-b border-amber-500/20 px-4 py-2 text-xs flex items-center justify-between transition-all">
        <div class="flex items-center space-x-2 max-w-7xl mx-auto w-full justify-between">
            <div class="flex items-center space-x-2">
                <span id="cloud-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="cloud-status-text" class="text-amber-200 font-mono">Conectando a Firebase Cloud (Multi-dispositivo)...</span>
            </div>
            <button onclick="openConfigModal()" class="text-amber-400 hover:text-amber-300 underline font-mono text-[11px]">Configurar Cloud</button>
        </div>
    </div>

    <!-- Header con Logo Estilo Referencia (C&M Parfum) -->
    <header id="main-header" class="bg-[#0e111a]/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-xl border bg-slate-900 border-slate-800 text-slate-300">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center space-x-3.5 group cursor-pointer" onclick="switchTab('inicio')">
                    <!-- Logo Vectorial Estilo Referencia (C&M PARFUM) -->
                    <div class="flex items-baseline select-none">
                        <span class="font-serif text-3xl font-extrabold tracking-tighter text-slate-100">C</span>
                        <span class="font-serif italic font-light text-2xl text-amber-400 -mx-1 relative -top-0.5">&amp;</span>
                        <span class="font-serif text-3xl font-extrabold tracking-tighter text-slate-100">M</span>
                    </div>
                    <div class="flex flex-col justify-center border-l border-slate-800 pl-3">
                        <span class="font-serif text-xs tracking-[0.3em] font-bold text-amber-300 uppercase leading-none">
                            PARFUM
                        </span>
                        <span class="text-[8px] font-mono tracking-[0.2em] uppercase mt-1 text-slate-400">
                            Mati &amp; Cele &bull; Management
                        </span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="toggleTheme()" class="p-2 rounded-xl border bg-slate-900 border-slate-800 text-amber-400 hover:bg-slate-800 transition-colors" title="Cambiar tema">
                    <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
                </button>
                <button onclick="openConfigModal()" class="px-3 py-1.5 rounded-xl border text-xs font-mono flex items-center space-x-1.5 transition-colors bg-amber-500/10 border-amber-500/30 text-amber-400">
                    <i data-lucide="cloud" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Firebase Sync</span>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-[#090b10] border-r border-slate-800/80 text-slate-300 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col">
            <div class="p-4 border-b border-slate-800/80 flex justify-between items-center md:hidden">
                <span class="font-serif text-sm tracking-widest text-amber-200 uppercase">Menú C&amp;M</span>
                <button onclick="toggleMobileMenu()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <nav id="nav-menu" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto"></nav>
            <div class="p-4 border-t border-slate-800/80 text-[11px] text-slate-500 text-center font-mono">
                C&amp;M Parfum v3.7 &bull; Multi-dispositivo
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
            <div id="view-container"></div>
        </main>
    </div>

    <!-- Modales -->
    <div id="config-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="max-w-lg w-full p-6 rounded-2xl border shadow-2xl space-y-4 bg-slate-900 border-slate-800 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <h3 class="font-serif text-lg text-amber-200">Configuración Firebase Cloud</h3>
                <button onclick="closeConfigModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="saveFirebaseConfig(event)" class="space-y-3 text-xs">
                <div><label class="text-slate-400 block mb-1">apiKey</label><input type="text" id="fb-apiKey" class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 font-mono"></div>
                <div><label class="text-slate-400 block mb-1">authDomain</label><input type="text" id="fb-authDomain" class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 font-mono"></div>
                <div><label class="text-slate-400 block mb-1">projectId</label><input type="text" id="fb-projectId" class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 font-mono"></div>
                <div><label class="text-slate-400 block mb-1">storageBucket</label><input type="text" id="fb-storageBucket" class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 font-mono"></div>
                <div><label class="text-slate-400 block mb-1">messagingSenderId</label><input type="text" id="fb-messagingSenderId" class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 font-mono"></div>
                <div><label class="text-slate-400 block mb-1">appId</label><input type="text" id="fb-appId" class="w-full p-2.5 rounded-xl border bg-slate-950 border-slate-800 text-slate-200 font-mono"></div>
                <div class="pt-2 flex space-x-2">
                    <button type="submit" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold rounded-xl">Guardar y Conectar</button>
                    <button type="button" onclick="clearFirebaseConfig()" class="px-4 py-2.5 bg-slate-800 text-slate-300 hover:text-white rounded-xl">Restablecer</button>
                </div>
            </form>
        </div>
    </div>

    <div id="dynamic-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div id="dynamic-modal-content" class="max-w-xl w-full p-6 rounded-2xl border shadow-2xl space-y-4 bg-slate-900 border-slate-800 max-h-[90vh] overflow-y-auto"></div>
    </div>

    <script>
        let theme = localStorage.getItem('CM_THEME') || 'dark';
        let activeTab = 'inicio';
        let mobileMenuOpen = false;

        let customFbConfig = JSON.parse(localStorage.getItem('CM_CUSTOM_FB_CONFIG') || 'null');
        let firebaseConfig = customFbConfig || {
            apiKey: "AIzaSyA9ujcWapbTqHZcKeyPYJNFsumv_TSRog",
            authDomain: "cm-perfumes-mov.firebaseapp.com",
            projectId: "cm-perfumes-mov",
            storageBucket: "cm-perfumes-mov.firebasestorage.app",
            messagingSenderId: "911655238464",
            appId: "1:911655238464:web:292f5a5924a4ab05fa98a5"
        };

        const appId = 'cm-perfumes-enterprise';
        let db = null; let auth = null; let currentUser = null; let unsubscribers = [];

        let state = {
            products: [
                { id: 'p1', name: 'Sauvage', brand: 'Dior', concentration: 'EDP', volume_ml: 100, cost_price: 45000, sale_price: 98000, physical_stock: 8 },
                { id: 'p2', name: 'Bleu de Chanel', brand: 'Chanel', concentration: 'EDP', volume_ml: 100, cost_price: 52000, sale_price: 115000, physical_stock: 5 }
            ],
            orders: [],
            sales: [],
            cashMovements: [],
            debts: [
                { id: 'd1', title: 'Deuda Proveedor Esencias', total_amount: 200000, paid_amount: 50000, status: 'Activa', notes: 'Acuerdo en cuotas' }
            ],
            supplies: []
        };

        const navItems = [
            { id: 'inicio', label: 'Resumen General', icon: 'layout-dashboard' },
            { id: 'stock', label: 'Stock & Inventario', icon: 'package' },
            { id: 'pedidos', label: 'Pedidos y Reservas', icon: 'shopping-bag' },
            { id: 'ventas', label: 'Ventas (Mati & Cele)', icon: 'shopping-cart' },
            { id: 'deudas', label: 'Control de Deudas', icon: 'credit-card' },
            { id: 'caja', label: 'Movimientos de Caja', icon: 'wallet' },
            { id: 'inversion', label: 'Ganancias 50/50', icon: 'users' },
            { id: 'calculadora', label: 'Calculadora de Margen', icon: 'calculator' }
        ];

        window.onload = function() {
            applyTheme();
            initFirebase();
            renderNavigation();
            switchTab('inicio');
            lucide.createIcons();
        };

        function initFirebase() {
            if (window.firebaseAppInit && firebaseConfig && firebaseConfig.apiKey) {
                try {
                    const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore } = window.firebaseAppInit;
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    signInAnonymously(auth).catch(e => console.error("Auth error:", e));

                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) {
                            document.getElementById('cloud-dot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-none';
                            document.getElementById('cloud-status-text').innerText = 'Sincronización Cloud Activa (Multi-dispositivo)';
                            setupRealtimeListeners();
                        }
                    });
                } catch(e) {
                    console.error("Firebase init error:", e);
                    setLocalMode();
                }
            } else {
                setLocalMode();
            }
        }

        function setLocalMode() {
            document.getElementById('cloud-dot').className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse';
            document.getElementById('cloud-status-text').innerText = 'Modo Local Activo';
            loadFromLocalStorage();
        }

        function setupRealtimeListeners() {
            if (!db) return;
            const { collection, onSnapshot } = window.firebaseAppInit;
            unsubscribers.forEach(unsub => unsub());
            unsubscribers = [];

            const cols = ['products', 'orders', 'sales', 'cashMovements', 'debts', 'supplies'];
            cols.forEach(colName => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                const unsub = onSnapshot(colRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(docSnap => items.push({ id: docSnap.id, ...docSnap.data() }));
                    if (items.length > 0 || snapshot.size >= 0) {
                        state[colName] = items;
                        renderCurrentView();
                    }
                });
                unsubscribers.push(unsub);
            });
        }

        async function syncCollectionToCloud(colName) {
            if (!db) { saveToLocalStorage(); return; }
            const { doc, setDoc } = window.firebaseAppInit;
            try {
                for (const item of state[colName]) {
                    const docId = item.id || 'item_' + Date.now();
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', colName, docId), item);
                }
            } catch(e) { saveToLocalStorage(); }
        }

        async function deleteCloudDoc(colName, docId) {
            if (!db) { saveToLocalStorage(); return; }
            const { doc, deleteDoc } = window.firebaseAppInit;
            try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', colName, docId)); } catch(e) {}
        }

        function saveToLocalStorage() { localStorage.setItem('CM_LOCAL_STATE', JSON.stringify(state)); }
        function loadFromLocalStorage() { const saved = localStorage.getItem('CM_LOCAL_STATE'); if (saved) { try { state = JSON.parse(saved); } catch(e){} } }

        function openConfigModal() { document.getElementById('config-modal').classList.remove('hidden'); }
        function closeConfigModal() { document.getElementById('config-modal').classList.add('hidden'); }

        function saveFirebaseConfig(e) {
            e.preventDefault();
            const newConfig = {
                apiKey: document.getElementById('fb-apiKey').value.trim(),
                authDomain: document.getElementById('fb-authDomain').value.trim(),
                projectId: document.getElementById('fb-projectId').value.trim(),
                storageBucket: document.getElementById('fb-storageBucket').value.trim(),
                messagingSenderId: document.getElementById('fb-messagingSenderId').value.trim(),
                appId: document.getElementById('fb-appId').value.trim()
            };
            localStorage.setItem('CM_CUSTOM_FB_CONFIG', JSON.stringify(newConfig));
            location.reload();
        }

        function clearFirebaseConfig() { localStorage.removeItem('CM_CUSTOM_FB_CONFIG'); location.reload(); }

        function notify(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-2xl border text-white flex items-center space-x-3 backdrop-blur-md transition-all transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/90 border-rose-500/50 text-rose-200'}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-triangle'}" class="w-4 h-4"></i><span class="font-medium text-sm">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function toggleTheme() {
            theme = theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('CM_THEME', theme);
            applyTheme();
        }

        function applyTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (theme === 'dark') { html.classList.add('dark'); if(icon) icon.setAttribute('data-lucide', 'sun'); }
            else { html.classList.remove('dark'); if(icon) icon.setAttribute('data-lucide', 'moon'); }
            lucide.createIcons();
        }

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            const sidebar = document.getElementById('sidebar');
            if (mobileMenuOpen) sidebar.classList.remove('-translate-x-full');
            else sidebar.classList.add('-translate-x-full');
        }

        function renderNavigation() {
            const nav = document.getElementById('nav-menu');
            nav.innerHTML = navItems.map(item => {
                const isActive = activeTab === item.id;
                return `<button onclick="switchTab('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${isActive ? 'bg-amber-500/20 border border-amber-500/30 text-amber-300 font-semibold' : 'hover:bg-slate-900 text-slate-400 hover:text-slate-200'}">
                    <i data-lucide="${item.icon}" class="w-4 h-4"></i><span>${item.label}</span>
                </button>`;
            }).join('');
            lucide.createIcons();
        }

        function switchTab(tabId) { activeTab = tabId; mobileMenuOpen = false; renderNavigation(); renderCurrentView(); }
        function renderCurrentView() {
            const container = document.getElementById('view-container');
            switch(activeTab) {
                case 'inicio': container.innerHTML = renderDashboardView(); break;
                case 'stock': container.innerHTML = renderStockView(); break;
                case 'pedidos': container.innerHTML = renderOrdersView(); break;
                case 'ventas': container.innerHTML = renderSalesView(); break;
                case 'deudas': container.innerHTML = renderDebtsView(); break;
                case 'caja': container.innerHTML = renderCashView(); break;
                case 'inversion': container.innerHTML = renderInvestmentView(); break;
                case 'calculadora': container.innerHTML = renderCalculatorView(); break;
                default: container.innerHTML = renderDashboardView();
            }
            lucide.createIcons();
        }

        function renderDashboardView() {
            const totalSales = state.sales.reduce((acc, s) => acc + s.total_amount, 0);
            const totalProfit = state.sales.reduce((acc, s) => acc + s.net_profit, 0);
            const totalDebts = state.debts.reduce((acc, d) => acc + (d.total_amount - (d.paid_amount || 0)), 0);
            return `
                <div class="space-y-6">
                    <div class="pb-2 border-b border-slate-800/80">
                        <h1 class="font-serif text-2xl font-normal text-amber-200">Resumen General C&amp;M Parfum</h1>
                        <p class="text-xs text-slate-400 mt-0.5">Control de gestión sincronizado en tiempo real.</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-slate-900/40 border border-slate-800/80 p-5 rounded-2xl">
                            <p class="text-xs text-slate-400 font-mono uppercase">Ventas Totales</p>
                            <h3 class="text-2xl font-semibold font-mono text-amber-300 mt-1">$${totalSales.toLocaleString()}</h3> </div> <div class="bg-slate-900/40 border border-slate-800/80 p-5 rounded-2xl"> <p class="text-xs text-slate-400 font-mono uppercase">Ganancia Neta</p> <h3 class="text-2xl font-semibold font-mono text-emerald-400 mt-1">$${totalProfit.toLocaleString()}</h3>
                        </div>
                        <div class="bg-slate-900/40 border border-slate-800/80 p-5 rounded-2xl">
                            <p class="text-xs text-slate-400 font-mono uppercase">Deudas Totales Pendientes</p>
